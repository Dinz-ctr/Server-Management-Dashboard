
services:
  postgres:
    image: postgres:16
    container_name: smd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: server_dashboard
      POSTGRES_USER: dashboard_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dashboard_user -d server_dashboard
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
